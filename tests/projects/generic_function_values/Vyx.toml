[package]
name = "generic_function_values"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"

[dependencies]
collections = { path = "std:collections", target = "std_collections" }

[target.generic_function_values]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
sources = ["src/callbacks.vyx", "src/main.vyx"]
