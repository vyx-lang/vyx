[package]
name = "extern_cpp_overalign_abi"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

# Over-aligned foreign objects across the DCI boundary.
#
# The producer is a C++ header (`native/Overalign.hpp`) and the contract is
# **derived from it by the adapter** (`run.ps1` runs
# `tools/dci/dci_adapter_msvc.py --include native/Overalign.hpp`); no `.dci`
# text is hand-written.  The only hand-authored input is the producer header
# itself, including its `dci-ownership` block -- which is where ownership is
# declared, because ownership is a property of the producer's API.
#
# What the fixture is for: Vyx builds a foreign record's *value* layout from
# the descriptor's `alignment` by mapping it onto one integer anchor plus an
# i8 tail (`finalize_record_ty_body` in `src/codegen/llvm/llvm_lower.vyx`), and the
# widest anchor is i128 / 16 bytes.  A record with `alignas(32)` / `alignas(64)`
# therefore has no anchor at all.
#
# `run.ps1` asserts the measured behaviour of all seven ABI surfaces --
# by value, pointer/reference, field embedding, constructor, return, heap
# allocation, generic argument -- for both `alignas(16)` (the control, which
# must keep working) and `alignas(64)`.  Flipping any of those assertions is a
# capability change and must be re-verified, not silently accepted.
[target.extern_cpp_overalign_abi]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "clang-cpp"
sources = [
    "native/Overalign.cpp",
]
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++20",
]
