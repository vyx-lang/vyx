[package]
name = "impl_module_targets"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.impl_module_targets]
type = "executable"
entry = "src/main.vyx"
sources = ["src/left.vyx", "src/right.vyx", "src/left_view.vyx", "src/right_view.vyx", "src/right_short_view.vyx", "src/mode.vyx", "src/mode_view.vyx"]
auto_sources = false
