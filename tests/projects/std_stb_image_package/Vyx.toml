[package]
name = "std_stb_image_package"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
stb_image = { path = "std:stb_image", target = "std_stb_image" }

[target.std_stb_image_package]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
