[package]
name = "extern_cpp_mir_abi"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.extern_cpp_mir_abi]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "clang-cpp"
sources = [
    "native/A.cpp",
]
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++17",
]
