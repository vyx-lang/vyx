[package]
name = "global_module_contract"
version = "0.1.0"
entry = "src/main.vyx"

[build]
output_dir = "target"

[target.global_module_contract]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
parallel_vyx = true
sources = ["src/storage.vyx", "src/storage_text.vyx", "src/reader.vyx", "src/writer.vyx", "src/peer.vyx", "src/peer_reader.vyx"]
