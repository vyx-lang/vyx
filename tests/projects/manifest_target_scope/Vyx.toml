[package]
name = "manifest_target_scope"
version = "0.1.0"
entry = "src/app_a.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
global_dep = { path = "deps/global", target = "global_dep" }

[target.scope_helper]
type = "static"
entry = "src/helper.vyx"
auto_sources = false

[target.app_a]
type = "executable"
entry = "src/app_a.vyx"
depends_on = ["scope_helper"]
lib_paths = ["target"]
libs = ["scope_helper"]
auto_sources = false

[target.app_a.dependencies]
local_dep = { path = "deps/local_a", target = "local_a_dep" }

[target.app_b]
type = "executable"
entry = "src/app_b.vyx"
auto_sources = false

[target.app_b.dependencies]
local_dep = { path = "deps/local_b", target = "local_b_dep" }
