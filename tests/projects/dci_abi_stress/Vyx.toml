[package]
name = "dci_abi_stress"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.dci_abi_stress]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "clang-cpp"
sources = [
    "native/DciStress.cpp",
]
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++17",
]
