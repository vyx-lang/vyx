[package]
name = "std_regex_uuid_toml"
version = "0.1.0"
entry = "src/main.vyx"
[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2
[dependencies]
std = { path = "std:std", target = "std" }
toml = { path = "std:serde", target = "serde_toml" }
[target.std_regex_uuid_toml]
type = "executable"
entry = "src/main.vyx"
sources = ["src/config.vyx", "native/lifecycle.c"]
include_paths = ["../../../bootstrap_compiler/std_packages/regex/vendor/pcre2", "../../../bootstrap_compiler/std_packages/serde/vendor/tomlc17"]
cflags = ["-DHAVE_CONFIG_H", "-DPCRE2_CODE_UNIT_WIDTH=8", "-DPCRE2_STATIC"]
auto_sources = false
