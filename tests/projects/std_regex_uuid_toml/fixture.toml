# Configuration used by a request router, including a pattern and node UUID.
[server]
id = "550E8400-E29B-41D4-A716-446655440000"
port = 8080
route = '^/jobs/(?<job>[0-9]+)$'
enabled = true
labels = ["local", "测试", ""]
limits = { max_connections = 128, timeout = 1.5 }

[[upstreams]]
name = "primary"
address = "https://example.org"
[[upstreams]]
name = "backup"
address = "https://backup.example.org"
