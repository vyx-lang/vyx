[package]
name = "std_cacao_package"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
cacao = { path = "std:cacao", target = "std_cacao" }

[target.std_cacao_package]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
