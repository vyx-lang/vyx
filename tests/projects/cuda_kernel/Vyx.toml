# Vyx-compiled CUDA kernels: the device code in device/kernel.vyx is lowered
# by `vyx build` and embedded into the host executable.
#
# The compiler locates the CUDA driver import library from
# VYX_CUDA_TOOLKIT_ROOT, or from the newest installed Windows toolkit.
# No project-local copy of cuda.lib is required.

[package]
name = "cuda_kernel"
version = "0.1.0"
entry = "src/host.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.cuda_kernel]
type = "executable"
entry = "src/host.vyx"
libs = [
    "cuda",
]
cuda_arch = "sm_120"
cuda_device_sources = [
    "device/kernel.vyx",
]
