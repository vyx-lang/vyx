[package]
name = "dci_complex_abi"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.dci_complex_abi]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "clang-cpp"
sources = [
    "native/Complex.cpp",
]
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++20",
]
