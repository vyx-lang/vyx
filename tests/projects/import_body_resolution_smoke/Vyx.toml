[package]
name = "import_body_resolution_smoke"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
dep_a = "./dep_a"
dep_b = "./dep_b"

[target.import_body_resolution_smoke]
type = "executable"
entry = "src/main.vyx"
lib_paths = ["target", "dep_a/target", "dep_b/target"]
libs = ["dep_a", "dep_b"]
