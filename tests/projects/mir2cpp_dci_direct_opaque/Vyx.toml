[package]
name = "mir2cpp_dci_direct_opaque"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.mir2cpp_dci_direct_opaque]
type = "executable"
entry = "src/main.vyx"
dci_file_windows = "contracts/OpaqueBox.dcib"
dci_stub_backend = "direct"
sources = [
    "native/OpaqueBox.cpp",
]
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++20",
]
