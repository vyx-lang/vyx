[package]
name = "industrial_mir_stress"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 4

[target.industrial_mir_stress]
type = "executable"
entry = "src/main.vyx"
sources = [
    "src/model.vyx",
    "src/pipeline.vyx",
    "src/async_ops.vyx"
]
