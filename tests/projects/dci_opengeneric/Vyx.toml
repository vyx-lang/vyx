[package]
name = "dci_opengeneric"
version = "0.1.0"
entry = "src/open_generic_cpp.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
# The open-generic closure retry (compile -> .dci_open requests ->
# dci_close_instances -> re-lower) runs on the immediate-task path, i.e. the
# single-threaded driver.  Same as the dci_rust_trait / dci_cpp_trait gates.
threads = 1

# The same Vyx call sites, the same open generics, the other producer.
#
# `dci_opengeneric_cpp` differs from `dci_opengeneric` in two things:
# the external backend is pointed at native/lib.hpp instead of native/lib.rs,
# so clang++ adjudicates the template constraints and monomorphizes the header
# (the `.hpp` extension is what selects the C++ producer); and it imports its
# own .dcib, because a .dcib is point-to-point -- it describes one producer's
# artifact, so switching producer means switching contract.
[target.dci_opengeneric]
type = "executable"
entry = "src/open_generic.vyx"
dci_stub_backend = "external"
dci_stub_capabilities = [
    "emit-source",
    "compile-object",
]
# External backend settings.  VYX_DCI_STUB_BACKEND_* wins when set (that is
# how run_vyx.sh points a build at a backend outside the project); these are
# the in-project fallback so a plain `vyx build` works from a checkout.
# The backend itself is shared -- `tools/dci/stub_backend.py`, the one place
# the external stub protocol is implemented; a project only states which
# producer it links, and the language follows from that file's extension.
# Relative paths are resolved against the project directory.
dci_stub_backend_tool = "python"
dci_stub_backend_tool_args = "../../../tools/dci/stub_backend.py --provider native/lib.rs"
dci_stub_backend_dependencies = [
    "../../../tools/dci/stub_backend.py",
    "native/lib.rs",
    "../../../tools/dci/active_rust.py",
    "../../../tools/dci/active_protocol.py",
    "../../../tools/dci/artifact_bundle.py",
    "../../../tools/dci/dcib.py",
]
dci_stub_backend_version = "dci-active-1"
dci_stub_backend_source_extension = "rs"
dci_stub_backend_capabilities = [
    "emit-source",
    "compile-object",
]

# src/open_generic_cpp.vyx keeps the same call sites as src/open_generic.vyx
# (the open-generic closures must be identical, and run_vyx.sh asserts the two
# `.dci_open` sidecars stay byte-identical) -- the two sources differ on exactly
# one line, the `@[dci_import]`.  Both call `v.norm1()`, a member function on a
# **non-generic** record: the control beside the generic-record member functions
# (which do cross the boundary, including the one that returns another
# instance).  The method crosses on both producers, each under its own ABI --
# clang++ emits the member symbol (`?norm1@Vec2@@QEBANXZ`), rustc emits the
# stable `vyx_vec2_norm1` that the Active Adapter asked for.
[target.dci_opengeneric_cpp]
type = "executable"
entry = "src/open_generic_cpp.vyx"
dci_stub_backend = "external"
dci_stub_capabilities = [
    "emit-source",
    "compile-object",
]
dci_stub_backend_tool = "python"
dci_stub_backend_tool_args = "../../../tools/dci/stub_backend.py --provider native/lib.hpp"
dci_stub_backend_dependencies = [
    "../../../tools/dci/stub_backend.py",
    "native/lib.hpp",
    "../../../tools/dci/active_cpp.py",
    "../../../tools/dci/active_protocol.py",
    "../../../tools/dci/artifact_bundle.py",
    "../../../tools/dci/dcib.py",
]
dci_stub_backend_version = "dci-active-1"
dci_stub_backend_source_extension = "cpp"
dci_stub_backend_capabilities = [
    "emit-source",
    "compile-object",
]
