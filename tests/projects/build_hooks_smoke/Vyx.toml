[package]
name = "build_hooks_smoke"
version = "0.1.0"
entry = "main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1
prebuild = ["vyx: hooks/build_pre.vyx"]
postbuild = ["vyx: hooks/build_post.vyx"]

[target.build_hooks_smoke]
type = "executable"
entry = "main.vyx"
prebuild = ["vyx: hooks/target_prebuild.vyx"]
precompile = ["vyx: hooks/precompile.vyx"]
postcompile = ["vyx: hooks/postcompile.vyx"]
postbuild = ["vyx: hooks/target_postbuild.vyx"]
