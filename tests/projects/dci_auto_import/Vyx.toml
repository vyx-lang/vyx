[package]
name = "dci_auto_import"
version = "0.1.0"
entry = "src/main.vyx"

[build]
output_dir = "target"
threads = 1

[target.dci_auto_import]
type = "executable"
entry = "src/main.vyx"
sources = ["native/session.cpp"]
dci_imports = ["session"]
dci_stub_backend = "clang-cpp"
cxx = "${LLVM_ROOT:-../../../clang}/bin/clang++.exe"
cxxflags = ["-std=c++17"]
include_paths = ["native"]

[dci.import.session]
module = "native.session"
headers = ["native/session.hpp"]
export_types = ["NativeSession"]
boundary = "shared_abi"
