[package]
name = "mixed_c_cpp_vyx"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.mixed_c_cpp_vyx]
type = "executable"
entry = "src/main.vyx"
sources = [
    "src/native_helpers.c",
    "src/native_helpers_cpp.cpp",
]
# include_paths is the new field: clang/clang++ get `-I <path>` for each entry.
include_paths = ["src/include"]
# cflags / cxxflags are passthrough tokens appended verbatim to the per-source
# compile command. Used here to exercise both the C and C++ paths.
cflags = ["-DMIXED_C_FLAG=42"]
cxxflags = ["-DMIXED_CXX_FLAG=84"]
