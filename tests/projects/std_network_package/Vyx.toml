[package]
name = "std_network_package"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
network = { path = "std:network", target = "std_network" }

[target.std_network_package]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
