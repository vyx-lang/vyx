[package]
name = "std_generic_contracts"
version = "0.1.0"
entry = "src/main.vyx"
[build]
cache_dir = ".cache"
output_dir = "target"
[target.library]
type = "static"
entry = "src/library.vyx"
auto_sources = false
[target.library.dependencies]
collections = { path = "std:collections", target = "std_collections" }
[target.std_generic_contracts]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
[target.std_generic_contracts.dependencies]
library = { target = "library" }
