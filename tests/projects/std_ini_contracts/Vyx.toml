[package]
name = "std_ini_contracts"
version = "0.1.0"
entry = "src/main.vyx"
[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2
[dependencies]
ini = { path = "std:serde", target = "serde_ini" }
io = { path = "std:io", target = "std_io" }
[target.std_ini_contracts]
type = "executable"
entry = "src/main.vyx"
sources = ["src/client_config.vyx"]
auto_sources = false
