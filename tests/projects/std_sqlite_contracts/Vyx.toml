[package]
name = "std_sqlite_contracts"
version = "0.1.0"
entry = "src/main.vyx"
[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2
[dependencies]
sqlite = { path = "std:sqlite", target = "std_sqlite" }
io = { path = "std:io", target = "std_io" }
[target.std_sqlite_contracts]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
