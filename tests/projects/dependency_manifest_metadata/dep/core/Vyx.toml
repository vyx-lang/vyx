[package]
name = "metadata_core_package"
version = "0.1.0"
entry = "src/core.vyx"

[build]
cache_dir = ".cache"
output_dir = "artifacts"
threads = 2

[target.actual_core]
type = "static"
entry = "src/core.vyx"
depends_on = ["core_support"]
sources = ["native/core.c"]
lib_paths = ["native_artifacts"]
libs = ["core_support"]

[target.core_support]
type = "static"
entry = "src/support.vyx"
output_dir = "native_artifacts"
sources = ["native/support.c"]
