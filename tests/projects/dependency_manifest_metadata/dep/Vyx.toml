[package]
name = "metadata_native_package"
version = "0.1.0"
entry = "src/native_math.vyx"

[build]
cache_dir = ".cache"
output_dir = "unused-default-output"
threads = 2

[dependencies]
core_alias = { path = "core", target = "actual_core" }

[target.actual_native_math]
type = "static"
entry = "src/native_math.vyx"
output_dir = "artifacts"
depends_on = ["support_native"]
sources = ["native/native_math.c"]
public_lib_paths = ["native_artifacts"]
public_libs = ["support_native"]

[target.support_native]
type = "static"
entry = "src/support.vyx"
output_dir = "native_artifacts"
sources = ["native/support.c"]
