[package]
name = "project_build_run"
version = "0.1.0"
entry = "src/main.vyx"

[build]
output_dir = "build products/default"
cache_dir = ".cache"
threads = 2
postbuild = ["vyx: scripts/post.vyx"]

[dependencies]
native_bits = { path = "native_lib", target = "native_bits" }

[target.project_build_run]
type = "executable"
entry = "src/main.vyx"
output_dir = "build products/selected app"
auto_sources = false
sources = ["src/values.vyx"]
parallel_vyx = true

[target.secondary]
type = "executable"
entry = "src/secondary.vyx"
auto_sources = false
