[package]
name = "dci_zig_abi"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 10
vyxflags = ["-O3"]

[target.dci_zig_abi]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "direct"
lib_paths = [
    "target",
]
libs = [
    "native",
]
