[package]
name = "std_url_contracts"
version = "0.1.0"
entry = "src/main.vyx"
[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2
[dependencies]
std = { path = "std:std", target = "std" }
[target.std_url_contracts]
type = "executable"
entry = "src/main.vyx"
sources = ["src/client_request.vyx"]
auto_sources = false
