[package]
name = "std_security_package"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
security = { path = "std:security", target = "std_security" }

[target.std_security_package]
type = "executable"
entry = "src/main.vyx"
auto_sources = false
