[package]
name = "dci_multilang"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 10
vyxflags = ["-O3"]

[target.dci_multilang]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "auto"
sources = [
    "../dci_complex_abi/native/Complex.cpp",
]
include_paths = [
    "../dci_complex_abi/native",
]
cxxflags = [
    "-std=c++20",
    "-O3",
]
lib_paths = [
    "target",
]
libs = [
    "zig_abi",
]
