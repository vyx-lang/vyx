[package]
name = "dci_cpp_trait"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.dci_cpp_trait]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "clang-cpp"
# A bare "clang++" would be passed verbatim to CreateProcessW with a non-NULL
# lpApplicationName, which does NOT search PATH on Windows (spawn rc=-1). The
# env-expanded absolute path is resolved literally; unset LLVM_ROOT falls back
# to build_tool_path("clang++") inside the build.
cxx = "${LLVM_ROOT}/bin/clang++"
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++17",
]
