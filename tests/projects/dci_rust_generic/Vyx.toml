[package]
name = "dci_rust_generic"
version = "0.1.0"
entry = "src/stub_backend.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"

[target.dci_rust_stub_backend]
type = "executable"
entry = "src/stub_backend.vyx"
dci_stub_backend = "external"
dci_stub_capabilities = [
    "emit-source",
    "compile-object",
]
