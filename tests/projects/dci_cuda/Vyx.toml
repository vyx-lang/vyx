# The CUDA provider (native/cuda_ops.cu) is compiled by *nvcc*, not by the Vyx
# build: nvcc owns the device pass, the PTX embedding and the host-side MSVC
# ABI.  DCI deliberately has no CUDA language front end - what crosses the
# contract is ordinary C++, derived from native/cuda_ops.hpp by the cpp adapter.
#
# run.ps1 drops the nvcc-built static library plus the CUDA runtime import
# library into native/prebuilt/, which is where `libs`/`lib_paths` below look.
# A bare `vyx build` therefore fails at link time by design; the supported
# entry points are run.ps1 and tests/run_all_modules.ps1.

[package]
name = "dci_cuda"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.dci_cuda]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "clang-cpp"
libs = [
    "cuda_ops",
    "cudart",
]
lib_paths = [
    "native",
    "native/prebuilt",
]
include_paths = [
    "native",
]
cxxflags = [
    "-std=c++20",
]
