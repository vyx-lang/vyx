[package]
name = "manifest_target_templates"
version = "0.1.0"
entry = "src/app_a.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

# Genuine package-global defaults. Templates and targets can override aliases
# or remove them from their effective dependency set.
[dependencies]
flavor = { path = "deps/flavor_default", target = "flavor_default" }
removed_dep = { path = "deps/removed", target = "removed_dep" }

[template.base]
auto_sources = false
parallel_vyx = true

[template.base.link]
# The portable placeholder entries must disappear through target-level remove.
libs = ["template_link_must_be_removed"]
lib_paths = ["vendor/template_path_must_be_removed"]
libs_windows = ["kernel32"]
libs_linux = ["m"]

[template.application]
extends = ["base"]
dependencies_remove = ["removed_dep"]

[template.application.dependencies]
# Overrides the package-global alias for every application target.
flavor = { path = "deps/flavor_common", target = "flavor_common" }

[target.math_core]
type = "static"
entry = "lib/math_core.vyx"
auto_sources = false
dependencies_remove = ["flavor", "removed_dep"]

[target.math_core.dependencies]
shared_numbers = { path = "deps/shared_numbers", target = "shared_numbers", usage = "public" }

[target.prepare]
type = "executable"
entry = "src/prepare.vyx"
auto_sources = false
dependencies_remove = ["flavor", "removed_dep"]

# Package-named default target keeps direct `--src=project --emit=cpp` on the
# same template resolver used by manifest builds, without external deps.
[target.manifest_target_templates]
extends = ["base"]
type = "executable"
entry = "src/cpp_probe.vyx"
dependencies_remove = ["flavor", "removed_dep"]

[target.manifest_target_templates.link]
libs_remove = ["template_link_must_be_removed"]
lib_paths_remove = ["vendor/template_path_must_be_removed"]

[target.app_a]
extends = ["application"]
type = "executable"
entry = "src/app_a.vyx"

[target.app_a.dependencies]
# Same-manifest target: path is intentionally omitted.
math = { target = "math_core", usage = "private" }
# Executable dependencies are build-order tools only.
prepare = { target = "prepare", usage = "build" }
# Concrete target override of the template alias.
flavor = { path = "deps/flavor_a", target = "flavor_a" }
local = { path = "deps/local_a", target = "local_a" }

[target.app_a.link]
libs_remove = ["template_link_must_be_removed"]
lib_paths_remove = ["vendor/template_path_must_be_removed"]
libs_windows = ["user32"]

[target.app_b]
extends = ["application"]
type = "executable"
entry = "src/app_b.vyx"

[target.app_b.dependencies]
math = { target = "math_core" }
local = { path = "deps/local_b", target = "local_b" }

[target.app_b.link]
libs_remove = ["template_link_must_be_removed"]
lib_paths_remove = ["vendor/template_path_must_be_removed"]
libs_windows = ["advapi32"]
