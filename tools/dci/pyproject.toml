[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vyx-dci-sdk"
version = "1.1.0"
description = "Vyx DCI toolchain as an extensible SDK: adapters, validator, DCIB codec, stub backends and a plugin registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.18"]

[project.scripts]
vyx-dci = "tools.dci.dci:main"

[project.entry-points."vyx_dci.commands"]
# Third parties add entries like:
# hello = "my_package.dci_plugin:hello_command"

[tool.setuptools]
packages = ["tools", "tools.dci"]
package-dir = {"" = ".."}

[tool.setuptools.package-data]
"tools.dci" = [
  "schema/*.json",
  "plugins/*.py",
  "plugins/*.md",
  "runtime/*.h",
  "runtime/*.hpp",
  "runtime/*.cpp",
  "runtime/*.rs",
]
