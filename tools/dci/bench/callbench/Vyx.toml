[package]
name = "dci_callbench"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1
vyxflags = ["-O3"]

[target.dci_callbench]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "direct"
sources = [
    "native/support.cpp",
    "../fixtures/abi_fixtures.cpp",
]
include_paths = [
    "native",
    "../fixtures",
]
cxxflags = [
    "-std=c++17",
    "-O3",
]
