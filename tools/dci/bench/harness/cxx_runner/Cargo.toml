[package]
name = "cxx_runner"
version = "0.1.0"
edition = "2021"
publish = false

# Pinned for rustc 1.83 compatibility.  The current cxx 1.0.19x series requires
# Rust >= 1.88 (edition2024 transitive dependencies), so this benchmark pins the
# last cxx line that resolves cleanly on the workstation's 1.83 toolchain.  See
# tools/dci/bench/README.md for the full toolchain fingerprint and rationale.
[dependencies]
cxx = "=1.0.129"

[build-dependencies]
cxx-build = "=1.0.129"
cc = "1"

[[bin]]
name = "cxx_runner"
path = "src/main.rs"
