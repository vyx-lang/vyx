[package]
name = "bindgen_runner"
version = "0.1.0"
edition = "2021"
publish = false

# bindgen 0.70.1 is the last line that resolves and builds on rustc 1.83; newer
# bindgen releases require a newer toolchain.  libclang is located through
# LIBCLANG_PATH (set to the LLVM 22 lib dir by the harness).
[build-dependencies]
bindgen = "=0.70.1"
cc = "1"

[[bin]]
name = "bindgen_runner"
path = "src/main.rs"
