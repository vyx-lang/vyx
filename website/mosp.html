<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="description" content="了解 Vyx 的 MOSP：Migrate 模块版本、Reflection 运行时反射、DCI 原生互操作与 DCE 代码裁剪，附代码示例和完整项目。" />
    <link rel="icon" type="image/png" href="./vyx.png" />
    <title>MOSP · Vyx</title>
    <script>
      /* Cross-document curtain. Only the page being entered reads the flag, and
         it does so here rather than in the app so the panel is already covering
         the viewport when the first frame is painted. */
      (function () {
        var entering = false
        try {
          entering = sessionStorage.getItem('vyx-page-transition') === 'enter'
          if (entering) sessionStorage.removeItem('vyx-page-transition')
        } catch (error) { entering = false }
        if (!entering) return
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        try { if (localStorage.getItem('vyx-motion-paused') === 'true') return } catch (error) { /* Optional preference. */ }
        var dark = false
        try { dark = localStorage.getItem('vyx-v2-theme') === 'dark' } catch (error) { dark = false }
        document.documentElement.setAttribute('data-page-enter', '')
        document.head.insertAdjacentHTML('beforeend', '<style>#vyx-transition{display:grid!important;position:fixed;inset:0;z-index:200;place-items:center;align-content:center;gap:18px;pointer-events:none;background:' + (dark ? '#0d0f14' : '#f7f8f4') + '}</style>')
      })()
    </script>
  </head>
  <body>
    <div id="vyx-transition" aria-hidden="true" style="display:none"><span class="vyx-transition-mark">VYX</span><span class="vyx-transition-rule"></span></div>
    <div id="app"></div>
    <script type="module" src="/src/mosp-main.js"></script>
  </body>
</html>
