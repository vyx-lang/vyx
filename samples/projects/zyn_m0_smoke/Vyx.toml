[package]
name = "zyn_m0_smoke"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.zyn_m0_smoke]
type = "executable"
entry = "src/main.vyx"
lib_paths = ["../../../Zyn/out", "../../../Zyn/vendor/SDL3/lib/x64", "../../../Zyn/vendor/Cacao/lib/x64"]
libs = ["Zyn", "SDL3", "Cacao"]
postbuild = ["vyx: hooks/copy_zyn_dll.vyx"]

[zyn.app]
name = "Zyn M0 Smoke"
id = "dev.vyx.zyn.keyboard_smoke"
entry = "src/main.vyx"
