[package]
name = "cacao_dci"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.cacao_dci]
type = "executable"
entry = "src/main.vyx"
dci_stub_backend = "direct"
lib_paths = ["third_party/cacao/lib"]
libs = ["CacaoDciBridge", "Cacao"]
postbuild = ["vyx: hooks/copy_runtime.vyx"]
