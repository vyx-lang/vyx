[package]
name = "win32_imgui_vulkan"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.win32_imgui_vulkan]
type = "executable"
entry = "src/main.vyx"
sources = [
    "third_party/cimgui/cimgui.cpp",
    "third_party/cimgui/cimgui_impl.cpp",
    "third_party/cimgui/imgui/imgui.cpp",
    "third_party/cimgui/imgui/imgui_draw.cpp",
    "third_party/cimgui/imgui/imgui_tables.cpp",
    "third_party/cimgui/imgui/imgui_widgets.cpp",
    "third_party/cimgui/imgui/imgui_demo.cpp",
    "third_party/cimgui/imgui/backends/imgui_impl_vulkan.cpp",
]
include_paths = [
    "third_party/cimgui",
    "third_party/cimgui/imgui",
    "third_party/cimgui/imgui/backends",
    "$VULKAN_SDK/Include",
]
cxxflags = [
    "-std=c++17",
    "-O2",
    "-DCIMGUI_USE_VULKAN",
    "-DVK_USE_PLATFORM_WIN32_KHR",
    "-DNOMINMAX",
    "-DWIN32_LEAN_AND_MEAN",
]
lib_paths = ["$VULKAN_SDK/Lib"]
libs = ["vulkan-1", "user32", "gdi32", "shell32", "ole32"]
