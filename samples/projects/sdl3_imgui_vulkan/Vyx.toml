[package]
name = "sdl3_imgui_vulkan"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.sdl3_imgui_vulkan]
type = "executable"
entry = "src/main.vyx"
sources = [
    "third_party/cimgui/cimgui.cpp",
    "third_party/cimgui/cimgui_impl.cpp",
    "third_party/cimgui/imgui/imgui.cpp",
    "third_party/cimgui/imgui/imgui_draw.cpp",
    "third_party/cimgui/imgui/imgui_tables.cpp",
    "third_party/cimgui/imgui/imgui_widgets.cpp",
    "third_party/cimgui/imgui/imgui_demo.cpp",
    "third_party/cimgui/imgui/backends/imgui_impl_sdl3.cpp",
    "third_party/cimgui/imgui/backends/imgui_impl_vulkan.cpp",
]
include_paths = [
    "third_party/cimgui",
    "third_party/cimgui/imgui",
    "third_party/cimgui/imgui/backends",
    "third_party/SDL3/include",
    "$VULKAN_SDK/Include",
]
cxxflags = [
    "-std=c++17",
    "-O2",
    "-DCIMGUI_USE_SDL3",
    "-DCIMGUI_USE_VULKAN",
]
lib_paths = ["third_party/SDL3/lib/x64", "$VULKAN_SDK/Lib"]
libs = ["SDL3", "vulkan-1"]
