[package]
name = "win32_vulkan"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.win32_vulkan]
type = "executable"
entry = "src/main.vyx"
# LunarG Vulkan SDK install path. Override here or via `-L` on the
# command line if you installed the SDK to a different location.
lib_paths = ["D:/Vulkan/Lib"]
# vulkan-1 is required for the Vulkan API; user32/gdi32 are needed
# for the Win32 window the demo creates.
libs = ["vulkan-1", "user32", "gdi32"]
