[package]
name = "manifest_windows_lib_names"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[dependencies]
native = { path = "dep", target = "native" }

[target.manifest_windows_lib_names]
type = "executable"
entry = "src/main.vyx"

[target.manifest_windows_lib_names.link]
# An explicit relative .lib path must be accepted by the compiler driver too.
libs_windows = ["lib/libcrypto.lib"]
