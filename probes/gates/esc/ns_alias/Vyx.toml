[package]
name = "ns_alias"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.ns_alias]
type = "executable"
entry = "src/main.vyx"
sources = [
    "src/parent_ns.vyx",
    "src/child_ns.vyx",
    "src/peer.vyx",
    "src/types_mod.vyx",
    "src/batch_fq.vyx",
    "src/batch_sibling.vyx",
    "src/main.vyx"
]
