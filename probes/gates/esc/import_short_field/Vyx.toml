[package]
name = "import_short_field"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[target.import_short_field]
type = "executable"
entry = "src/main.vyx"
sources = [
    "src/types.vyx",
    "src/batch.vyx",
    "src/world.vyx",
    "src/session.vyx",
    "src/main.vyx"
]
