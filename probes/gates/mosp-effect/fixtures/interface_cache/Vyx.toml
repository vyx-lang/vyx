[package]
name = "interface_cache"
version = "0.1.0"
entry = "library.vyx"

[build]
output_dir = "target"
cache_dir = ".cache"

[target.stub]
type = "static"
entry = "vyx_rt_stub.vyx"

[target.disabled]
type = "static"
entry = "library.vyx"
emit_vyi = false

[target.enabled]
type = "static"
entry = "library.vyx"
emit_vyi = true
