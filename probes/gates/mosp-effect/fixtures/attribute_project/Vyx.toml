[package]
name = "attribute_project"
version = "0.1.0"
entry = "main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 2

[effect]
# The root-level acme.attr is discovered automatically.  Additional files
# can live in subdirectories and are resolved relative to this manifest.
auto_discover = true
attr_files = ["attrs/common.attr"]

[target.attribute_project]
type = "executable"
entry = "main.vyx"
