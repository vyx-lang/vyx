[package]
name = "dci_vector"
version = "0.1.0"
entry = "main.vyx"

[build]
threads = 1
cache_dir = ".cache"
output_dir = "target"

[target.dci_vector]
type = "executable"
entry = "main.vyx"
sources = ["native.cpp"]
cxxflags = ["-std=c++17", "-fexceptions", "-fcxx-exceptions"]
cxxflags_windows = ["-fms-runtime-lib=static", "-mno-incremental-linker-compatible"]
dci_stub_backend = "external"
dci_stub_capabilities = ["emit-source", "compile-object"]
dci_stub_backend_tool = "python"
dci_stub_backend_tool_args = "../../../tools/dci/stub_backend.py --provider vector.hpp"
dci_stub_backend_dependencies = ["vector.hpp", "../../../tools/dci/stub_backend.py", "../../../tools/dci/cpp_materialize.py", "../../../tools/dci/active_cpp.py", "../../../tools/dci/dci_close_instances.py", "../../../tools/dci/dci_adapter_msvc.py"]
dci_stub_backend_version = "dci-active-1"
dci_stub_backend_source_extension = "cpp"
dci_stub_backend_capabilities = ["emit-source", "compile-object"]
