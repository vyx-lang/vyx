[package]
name = "dci_qt_counter"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.dci_qt_counter]
type = "executable"
entry = "src/main.vyx"
dci_imports = ["qt_widgets"]
postbuild = ["${SystemRoot}/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/deploy_qt.ps1"]
dci_stub_backend = "clang-cpp"
cxx = "${DCI_QT_CXX:-${LLVM_ROOT:-../../../clang}/bin/clang++.exe}"
include_paths = [
    "native",
    ".cache/dci/qt_widgets",
    "${DCI_QT_INCLUDE:-${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include}",
    "${DCI_QT_INCLUDE_QTCORE:-${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include/QtCore}",
    "${DCI_QT_INCLUDE_QTGUI:-${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include/QtGui}",
    "${DCI_QT_INCLUDE_QTWIDGETS:-${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include/QtWidgets}",
    "${DCI_QT_MKSPECS:-${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/mkspecs/win32-msvc}",
]
cxxflags = [
    "-std=c++17",
    "-fms-compatibility",
    "-DQT_CORE_LIB",
    "-DQT_GUI_LIB",
    "-DQT_WIDGETS_LIB",
    "-DUNICODE",
    "-D_UNICODE",
    "-DWIN32",
    "-D_WIN64",
]
lib_paths = [
    "${DCI_QT_LIBDIR:-${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/lib}",
]
libs = [
    "Qt6Widgets",
    "Qt6Gui",
    "Qt6Core",
    "Qt6Core",
]

[dci.import.qt_widgets]
module = "qt.widgets"
contract = "contracts/qt_widgets.dcib"
definitions = "src/qt_widgets.vyx"
profile = "qt"
headers = ["native/qt_widgets_dci.hpp"]
export_types = ["QApplication", "QString", "QWidget", "QLCDNumber", "QPushButton", "QVBoxLayout", "QTimerEvent", "QLayout", "QObject"]
ownership_headers = ["../../../tools/dci/profiles/qt_widgets.hpp"]
qt_connections = ["QAbstractButton::clicked(bool)"]
boundary = "shared_abi"
project_roots = [
    "${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include",
    "${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include/QtCore",
    "${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include/QtGui",
    "${QTDIR:-E:/Qt/6.7.3/msvc2019_64}/include/QtWidgets",
]
