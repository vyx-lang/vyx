[package]
name = "dci_failure_probe"
version = "0.1.0"
entry = "checked_divide.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 1

[target.dci_failure_probe]
type = "executable"
entry = "checked_divide.vyx"
dci_stub_backend = "direct"
sources = [
    "generated/translate_unwind.cpp",
    "../../../tools/dci/runtime/dci_failure_common.cpp",
    "../../../tools/dci/runtime/dci_msvc_failure.cpp",
    "../../../tools/dci/bench/fixtures/abi_fixtures.cpp",
]
include_paths = [
    "../../../tools/dci/runtime",
    "../../../tools/dci/bench/fixtures",
]
cxxflags = [
    "-std=c++17",
    "-fexceptions",
    "-fcxx-exceptions",
    "-fms-compatibility",
]
