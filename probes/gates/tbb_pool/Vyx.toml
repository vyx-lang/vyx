[package]
name = "tbb_pool_probe"
version = "0.1.0"
entry = "src/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "target"
threads = 0

[dependencies]
sync = { path = "std:sync", target = "std_sync" }

[target.tbb_pool_probe]
type = "executable"
entry = "src/main.vyx"
sources = ["src/main.vyx"]
auto_sources = false
