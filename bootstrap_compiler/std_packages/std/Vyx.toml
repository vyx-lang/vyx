[package]
name = "std_package"
version = "0.1.0"
entry = "src/allocator.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
collections = { path = "std:collections", target = "std_collections" }
algorithm = { path = "std:algorithm", target = "std_algorithm" }
io = { path = "std:io", target = "std_io" }
sync = { path = "std:sync", target = "std_sync" }
format = { path = "std:format", target = "std_format" }
testing = { path = "std:testing", target = "std_testing" }
miniz = { path = "std:miniz", target = "std_miniz" }
serde = { path = "std:serde", target = "serde_json" }

[target.std]
type = "source"
entry = "src/allocator.vyx"
sources = [
    "src/bits.vyx",
    "src/convert.vyx",
    "src/drop.vyx",
    "src/encoding.vyx",
    "src/error.vyx",
    "src/event.vyx",
    "src/math.vyx",
    "src/os.vyx",
    "src/random.vyx",
    "src/reflect.vyx",
    "src/regex.vyx",
    "src/semver.vyx",
    "src/simd.vyx",
    "src/time.vyx",
    "src/url.vyx",
    "src/uuid.vyx",
]
auto_sources = false
