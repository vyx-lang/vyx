[package]
name = "std_io_package"
version = "0.1.0"
entry = "src/io.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
collections = { path = "std:collections", target = "std_collections" }

[target.std_io]
type = "source"
entry = "src/io.vyx"
sources = [
    "src/fs.vyx",
    "src/path.vyx",
    "src/process.vyx",
    "src/args.vyx",
    "src/env.vyx",
    "src/ffi.vyx",
    "src/vio.vyx",
]
auto_sources = false
