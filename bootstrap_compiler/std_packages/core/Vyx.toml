[package]
name = "std_core_package"
version = "0.1.0"
entry = "src/option.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[target.std_core]
type = "source"
entry = "src/option.vyx"
sources = [
    "src/result.vyx",
    "src/default.vyx",
    "src/clone.vyx",
    "src/string.vyx",
    "src/ref.vyx",
    "src/hash.vyx",
    "src/ops.vyx",
    "src/num.vyx",
]
auto_sources = false
