[package]
name = "std_serde_package"
version = "0.1.0"
entry = "src/serde.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
collections = { path = "std:collections", target = "std_collections" }

# The whole serialization family lives in one package, exposed as several
# targets.  A target name cannot contain a dot (`build_target_sections`
# deliberately skips `[target.*.*]`, which is how `[target.x.link]` stays a
# modifier rather than a target), so the *module* carries the dotted name and
# the target uses underscores:
#
#   target            module                consumer spelling
#   ----------------  --------------------  -----------------------
#   serde             std.serde             use std.serde;
#   serde_json        std.serde.json        use std.serde.json;
#   serde_toml        std.serde.toml        use std.serde.toml;
#   serde_yaml        std.serde.yaml        use std.serde.yaml;
#   serde_ini         std.serde.ini         use std.serde.ini;
#   serde_csv         std.serde.csv         use std.serde.csv;
#
# `std.serde` is the aggregate: the framework (traits, the serializer /
# deserializer contract, shared helpers) lives in that single file, and each
# format module builds on it.  Module names are declared inside the files, not
# derived from paths, so the dotted names are what `use` matches on.

# The aggregate surface: the whole serde framework in one file.
[target.serde]
type = "source"
entry = "src/serde.vyx"
sources = [
    "src/serde.vyx",
]
auto_sources = false

# JSON keeps its cJSON bridge (and the vendored cJSON it wraps).
#
# `type = "static"` (not "source"): a static target is what emits the `.lib`
# a consumer links against, and the bridge's `vyx_json_*` symbols live in that
# `.lib`.  A "source" target only emits a `.vyi` interface, so the native
# objects would never reach the linker.  `entry` carries json.vyx; `sources`
# lists only the native translation units.
[target.serde_json]
type = "static"
entry = "src/json.vyx"
sources = [
    "native/json_bridge.c",
    "vendor/cJSON.c",
]
include_paths = [
    "vendor",
]
auto_sources = false

[target.serde_toml]
type = "source"
entry = "src/toml.vyx"
sources = [
    "src/toml.vyx",
]
auto_sources = false

[target.serde_yaml]
type = "source"
entry = "src/yaml.vyx"
sources = [
    "src/yaml.vyx",
]
auto_sources = false

[target.serde_ini]
type = "source"
entry = "src/ini.vyx"
sources = [
    "src/ini.vyx",
]
auto_sources = false

[target.serde_csv]
type = "source"
entry = "src/csv.vyx"
sources = [
    "src/csv.vyx",
]
auto_sources = false
