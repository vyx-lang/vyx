[package]
name = "std_miniz_package"
version = "0.1.0"
entry = "src/miniz.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }

[target.std_miniz]
type = "static"
entry = "src/miniz.vyx"
sources = [
    "native/miniz_bridge.c",
    "vendor/miniz.c",
    "vendor/miniz_tdef.c",
    "vendor/miniz_tinfl.c",
]
include_paths = ["vendor"]
cflags = ["-DMINIZ_NO_ARCHIVE_APIS"]
