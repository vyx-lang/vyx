[package]
name = "std_cacao_package"
version = "0.1.0"
entry = "src/cacao.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
collections = { path = "std:collections", target = "std_collections" }

[target.std_cacao]
type = "source"
entry = "src/cacao.vyx"
auto_sources = false
