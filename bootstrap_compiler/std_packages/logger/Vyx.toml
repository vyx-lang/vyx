[package]
name = "std_logger_package"
version = "0.1.0"
entry = "src/log.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 1
prebuild = ["vyx: scripts/prepare_spdlog.vyx"]

[scripts]
prepare = "vyx: scripts/prepare_spdlog.vyx"

[dependencies]
core = { path = "std:core", target = "std_core" }

# Opt-in native package: DCI + compiled spdlog. Not in the implicit --src=file
# registry and not in the std:std aggregate (same rule as curl/cacao).
[target.std_logger]
type = "static"
entry = "src/log.vyx"
auto_sources = false
dci_stub_backend = "clang-cpp"
dci_file = "contracts/spdlog.dcib"
cxx = "clang++"
sources = [
    "native/spdlog_support.cpp",
]
include_paths = [
    "native",
    "vendor/spdlog/include",
]
cxxflags = [
    "-std=c++17",
    "-DSPDLOG_COMPILED_LIB",
    "-fexceptions",
]
lib_paths = [
    "vendor/build",
]
libs = [
    "spdlog",
    "pthread",
]
public_lib_paths = [
    "vendor/build",
]
public_libs = [
    "spdlog",
    "pthread",
]
