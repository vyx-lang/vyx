[package]
name = "std_sync_package"
version = "0.1.0"
entry = "src/sync.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
collections = { path = "std:collections", target = "std_collections" }

[target.std_sync]
type = "source"
entry = "src/sync.vyx"
sources = [
    "src/channel.vyx",
    "src/threading.vyx",
    "src/thread_pool.vyx",
    "src/concurrent.vyx",
]
auto_sources = false
