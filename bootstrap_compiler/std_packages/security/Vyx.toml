[package]
name = "std_security_package"
version = "0.1.0"
entry = "src/openssl.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }

[target.std_security]
type = "source"
entry = "src/openssl.vyx"
sources = [
    "src/openssl.vyx",
    "src/crypto.vyx",
]
auto_sources = false

[target.std_security.link]
# Consuming targets link OpenSSL automatically. This table names the real
# library and the real install roots; it never fabricates or substitutes one,
# and a missing library stays a link error.
#
# On POSIX, `-l ssl` resolves to libssl.so/libssl.dylib. Windows packages
# install `libssl.lib` and `libcrypto.lib`, so name their exact stems here.
public_libs_linux = ["ssl", "crypto"]
public_libs_android = ["ssl", "crypto"]
public_libs_macos = ["ssl", "crypto"]
public_libs_windows = ["libssl", "libcrypto"]

# Real install roots. `${VAR:-default}` keeps an unset variable from producing
# a half-built path, and the linker ignores search directories that do not
# exist -- so an absent OpenSSL stays a link error instead of being silently
# satisfied.
public_lib_paths_macos = [
    "/opt/homebrew/opt/openssl@3/lib",
    "/opt/homebrew/opt/openssl/lib",
    "/usr/local/opt/openssl@3/lib",
    "/usr/local/opt/openssl/lib",
]
public_lib_paths_windows = [
    "${VCPKG_ROOT:-C:/vcpkg}/installed/x64-windows/lib",
    "C:/Program Files/OpenSSL-Win64/lib/VC/x64/MD",
    "C:/Program Files/OpenSSL-Win64/lib/VC/x64/MT",
    "C:/Program Files/OpenSSL-Win64/lib",
    "C:/Program Files/OpenSSL/lib",
]
