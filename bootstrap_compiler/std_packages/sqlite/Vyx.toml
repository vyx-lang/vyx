[package]
name = "std_sqlite_package"
version = "0.1.0"
entry = "src/sqlite.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
collections = { path = "std:collections", target = "std_collections" }

[target.std_sqlite]
type = "source"
entry = "src/sqlite.vyx"
auto_sources = false

[target.std_sqlite.link]
public_libs_windows = ["sqlite3"]
public_libs_linux = ["sqlite3"]
public_libs_android = ["sqlite3"]
public_libs_macos = ["sqlite3"]
public_lib_paths_windows = ["${VCPKG_ROOT:-C:/vcpkg}/installed/x64-windows/lib"]
