[package]
name = "std_format_package"
version = "0.1.0"
entry = "../core/src/fmt.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }

[target.std_format]
type = "source"
entry = "../core/src/fmt.vyx"
sources = ["src/color.vyx"]
auto_sources = false
