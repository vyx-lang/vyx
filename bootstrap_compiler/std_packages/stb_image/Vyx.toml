[package]
name = "std_stb_image_package"
version = "0.1.0"
entry = "src/stb_image.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }

[target.std_stb_image]
type = "static"
entry = "src/stb_image.vyx"
sources = [
    "native/stb_image_stub.c",
]
include_paths = ["vendor"]
