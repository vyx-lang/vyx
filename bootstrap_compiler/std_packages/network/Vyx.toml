[package]
name = "std_network_package"
version = "0.1.0"
entry = "src/curl.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }
std = { path = "std:std", target = "std" }
security = { path = "std:security", target = "std_security" }

[target.std_network]
type = "source"
entry = "src/curl.vyx"
sources = [
    "src/curl.vyx",
    "src/httpclient.vyx",
    "src/websockets.vyx",
    "src/grpc.vyx",
]
auto_sources = false

[target.std_network.link]
# Consuming targets link libcurl automatically. This table names the real
# library and the real install roots; it never fabricates or substitutes one,
# and a missing library stays a link error.
#
# OpenSSL is not repeated here: it arrives through the std:security dependency
# above, whose public link closure is propagated to consumers.
#
# Windows import libraries use the `libcurl.lib` filename. The build driver
# preserves `libcurl` when forwarding it to clang/lld.
public_libs_linux = ["curl"]
public_libs_android = ["curl"]
public_libs_macos = ["curl"]
public_libs_windows = ["libcurl", "ws2_32"]

public_lib_paths_macos = [
    "/opt/homebrew/opt/curl/lib",
    "/usr/local/opt/curl/lib",
]
public_lib_paths_windows = [
    "${VCPKG_ROOT:-C:/vcpkg}/installed/x64-windows/lib",
]
