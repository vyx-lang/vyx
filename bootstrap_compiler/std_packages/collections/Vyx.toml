[package]
name = "std_collections_package"
version = "0.1.0"
entry = "src/collections.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 2

[dependencies]
core = { path = "std:core", target = "std_core" }

[target.std_collections]
type = "source"
entry = "src/collections.vyx"
sources = [
    "src/bitset.vyx",
    "src/btree.vyx",
    "src/deque.vyx",
    "src/dict.vyx",
    "src/hashmap.vyx",
    "src/hashset.vyx",
    "src/iter.vyx",
    "src/list.vyx",
    "src/pair.vyx",
    "src/priority_queue.vyx",
    "src/set.vyx",
    "src/slice.vyx",
    "src/stack.vyx",
    "src/tuple.vyx",
    "src/vec.vyx",
]
auto_sources = false
