# ─── Target 4: vyxc-lsp.exe (bootstrap Language Server) ────────────────
# Independent stdio LSP binary. Open buffers run Sema for hover types and
# publishDiagnostics. Links cJSON via the std json package bridge.
[target.vyxc-lsp]
type = "executable"
entry = "src/core/tooling/lsp_main.vyx"
mir2cpp_entry = "main"
depends_on = ["vyx_compiler_backend", "vyx_runtime"]
lib_paths = ["out"]
libs = ["vyx_compiler_backend", "vyx_runtime"]
# diag.vyx now pulls std.sync (the R4 full-mode diag mutex), whose Windows
# park/unpark primitives live in synchronization.lib -- same as the vyxc
# target above.
libs_windows = ["synchronization"]
sources = [
    "src/codegen/abi/dci_abi.vyx",
    "src/core/dci/dci_dcib.vyx",
    "src/core/dci/dci_ids.vyx",
    "src/core/facts/effect.vyx",
