# Bootstrap compiler — self-host build via `boot build`
#
# Produces:
#   out/vyx_compiler_backend.* — private LLVM bridge + compiler host services
#   out/vyx_runtime.*          — static runtime for generated programs
#   out/boot.*       — compatibility name for the self-host compiler
#   out/vyxc.*       — SDK compiler entry point
#
# Prerequisites:
#   - A working boot bootstrap binary with include_paths/cxxflags support
#   - LLVM_ROOT pointing at this repository's bundled SDK root:
#       repo_root/clang
#     From bootstrap_compiler/ on Windows:
#       $env:LLVM_ROOT = "..\clang"
#
# Usage (from bootstrap_compiler/):
#   boot build

[package]
name = "boot"
version = "1.0.0-alpha.1"
entry = "src/core/driver/main.vyx"

[build]
cache_dir = ".cache"
output_dir = "out"
threads = 0
vyxflags = ["-O2"]
# `parallel_vyx` schedules independent source/interface units.  MIR root
# partitioning starts a complete compiler process per root chunk and is kept
# explicitly opt-in after measurement for a particular project.
mir_partition = false

# ─── Target 1: private compiler backend ─────────────────────────────────
[target.vyx_compiler_backend]
type = "shared"
entry = "src/core/runtime/vyx_rt_stub.vyx"
sources = ["../vyx_codegen/src/vyx_codegen.cpp", "../vyx_codegen/src/vyx_bootstrap_rt.cpp", "../vyx_codegen/src/vyx_service_memory.cpp", "../vyx_codegen/src/vyx_lsp_bindings.cpp", "../vyx_codegen/src/vyx_dap_launcher.cpp", "../vyx_codegen/src/vyx_dap_engine.cpp"]
include_paths = ["../vyx_codegen/include", "$LLVM_ROOT/include"]
lib_paths = ["$LLVM_ROOT/lib"]
cc = "$LLVM_ROOT/bin/clang"
cxx = "$LLVM_ROOT/bin/clang++"
ar = "$LLVM_ROOT/bin/llvm-ar"
cxxflags = ["-fno-rtti", "-fno-exceptions", "-DVYX_CODEGEN_BUILD", "-D_CRT_SECURE_NO_DEPRECATE", "-D__STDC_CONSTANT_MACROS", "-D__STDC_FORMAT_MACROS", "-D__STDC_LIMIT_MACROS", "-O2"]
cxxflags_windows = ["-fms-runtime-lib=static", "-mno-incremental-linker-compatible", "-DUNICODE", "-D_UNICODE"]
cxxflags_linux = ["-fPIC"]
cxxflags_android = ["-fPIC"]
cxxflags_apple = ["-fPIC"]
libs = []
libs_linux = ["LLVM", "z", "zstd"]
libs_android = ["LLVM"]
libs_apple = ["LLVM"]
libs_windows = ["LLVMAArch64AsmParser", "LLVMAArch64CodeGen", "LLVMAArch64Desc", "LLVMAArch64Utils", "LLVMAArch64Info", "LLVMARMAsmParser", "LLVMARMCodeGen", "LLVMARMDesc", "LLVMARMUtils", "LLVMARMInfo", "LLVMBPFAsmParser", "LLVMBPFCodeGen", "LLVMBPFDesc", "LLVMBPFInfo", "LLVMNVPTXCodeGen", "LLVMNVPTXDesc", "LLVMNVPTXInfo", "LLVMRISCVAsmParser", "LLVMRISCVCodeGen", "LLVMRISCVDesc", "LLVMRISCVInfo", "LLVMWebAssemblyAsmParser", "LLVMWebAssemblyCodeGen", "LLVMWebAssemblyDesc", "LLVMWebAssemblyUtils", "LLVMWebAssemblyInfo", "LLVMX86AsmParser", "LLVMX86CodeGen", "LLVMX86Desc", "LLVMX86Info", "LLVMOrcJIT", "LLVMOrcShared", "LLVMOrcTargetProcess", "LLVMJITLink", "LLVMMCJIT", "LLVMExecutionEngine", "LLVMRuntimeDyld", "LLVMWindowsDriver", "LLVMOption", "LLVMMCDisassembler", "LLVMAsmPrinter", "LLVMPasses", "LLVMIRPrinter", "LLVMHipStdPar", "LLVMCoroutines", "LLVMipo", "LLVMInstrumentation", "LLVMVectorize", "LLVMSandboxIR", "LLVMLinker", "LLVMFrontendOpenMP", "LLVMFrontendDirective", "LLVMFrontendAtomic", "LLVMFrontendOffloading", "LLVMObjectYAML", "LLVMGlobalISel", "LLVMSelectionDAG", "LLVMCodeGen", "LLVMScalarOpts", "LLVMInstCombine", "LLVMObjCARCOpts", "LLVMCodeGenTypes", "LLVMCGData", "LLVMBitWriter", "LLVMCFGuard", "LLVMAggressiveInstCombine", "LLVMTransformUtils", "LLVMTarget", "LLVMAnalysis", "LLVMProfileData", "LLVMSymbolize", "LLVMDebugInfoBTF", "LLVMDebugInfoPDB", "LLVMDebugInfoMSF", "LLVMDebugInfoCodeView", "LLVMDebugInfoGSYM", "LLVMDebugInfoDWARF", "LLVMObject", "LLVMTextAPI", "LLVMMCParser", "LLVMIRReader", "LLVMAsmParser", "LLVMMC", "LLVMDebugInfoDWARFLowLevel", "LLVMBitReader", "LLVMFrontendHLSL", "LLVMCore", "LLVMRemarks", "LLVMBitstreamReader", "LLVMBinaryFormat", "LLVMTargetParser", "LLVMSupport", "LLVMDemangle", "psapi", "shell32", "ole32", "uuid", "advapi32", "ws2_32", "ntdll"]

# ─── Target 2: canonical application runtime (Vyx, static) ──────────────
[target.vyx_runtime]
type = "static"
entry = "../runtime/src/vyx_runtime.vyx"
# The runtime is a deliberately large single Vyx unit.  Keeping its own
# optimization level at O1 avoids exhausting the bootstrap compiler's pooled
# string arena during the AOT self-host build while retaining LLVM's local
# simplification and inlining passes.  Compiler and application targets remain
# at the package O2 default.
vyxflags = ["-O1"]
ar = "$LLVM_ROOT/bin/llvm-ar"
cc = "$LLVM_ROOT/bin/clang"
cxx = "$LLVM_ROOT/bin/clang++"
cflags_windows = ["-mno-incremental-linker-compatible"]
cxxflags = ["-DTBB_USE_EXCEPTIONS=0", "-D__TBB_NO_IMPLICIT_LINKAGE=1"]
cxxflags_windows = ["-mno-incremental-linker-compatible"]
include_paths = ["../runtime/vendor/oneTBB/include"]
prebuild = ["vyx: ../runtime/scripts/prepare_tbb.vyx"]
sources = [
    "../runtime/src/vyx_fiber_abi.c",
    "../runtime/src/vyx_service_alloc.c",
    "../runtime/src/vyx_service_memory.c",
    "../runtime/src/vyx_string_search.c",
    "../runtime/src/vyx_host_args.c",
    "../runtime/src/vyx_sync.c",
    "../runtime/src/vyx_tbb.cpp",
    "src/codegen/llvm/emit/cgu_tbb.cpp",
]

# ─── Target 3: boot.exe (links the private compiler backend) ────────────
[target.boot]
type = "executable"
entry = "src/core/driver/main.vyx"
# The generated C++ boot must retain normal command dispatch so it can build
# the next stage, rather than only accepting --emit=cpp.
mir2cpp_entry = "main"
depends_on = ["vyx_compiler_backend", "vyx_runtime"]
output_aliases = ["vyxc"]
lib_paths = ["out"]
libs = ["vyx_compiler_backend", "vyx_runtime"]
# The CGU emit thread uses std.sync / std.threading.  Windows resolves
# WaitOnAddress / WakeByAddressSingle through `synchronization`; the
# current build system adds it automatically for std.sync sources, but
# the pinned bootstrap compiler predates that rule.
libs_windows = ["synchronization", "tbb12"]
libs_linux = ["tbb"]
sources = [
    "std_packages/serde/vendor/cJSON.c",
