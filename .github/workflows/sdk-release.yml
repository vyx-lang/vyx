name: SDK release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: Compatible Stage 0 SDK release
        default: latest
        type: string
        required: true
      macos_bootstrap:
        description: macOS bootstrap input (native Release SDK; cross is an explicit recovery path)
        default: native
        type: choice
        options: [native, cross]
        required: true
      build_scope:
        description: Build all release platforms or validate macOS only
        default: all
        type: choice
        options: [all, macos]
        required: true
      macos_stage:
        description: Validate the pinned toolchain or build the complete macOS SDK
        default: sdk
        type: choice
        options: [sdk, toolchain]
        required: true
      macos_fixpoint:
        description: Also rebuild native S2/S3 and verify the macOS fixed point
        default: false
        type: boolean

permissions:
  contents: read

env:
  BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag || 'latest' }}
  PYTHONUNBUFFERED: '1'
  MACOS_BOOTSTRAP: ${{ inputs.macos_bootstrap || 'native' }}

jobs:
  native:
    if: inputs.build_scope != 'macos'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2022
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check release scripts
        run: python -m unittest discover -s bootstrap_compiler/scripts/release -p "test_*.py"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 llvm-22-dev lld-22 libclang-cpp22-dev cmake ninja-build git patchelf zlib1g-dev libzstd-dev libxml2-dev
          echo 'LLVM_ROOT=/usr/lib/llvm-22' >> "$GITHUB_ENV"
      - name: Restore Windows LLVM development cache
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-22
          key: llvm-dev-win-x64-22.1.8-d96c2cc1736f4eb7-stream-v1
      - name: Prepare Windows LLVM development files
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-22'
          if ('${{ steps.llvm-cache.outputs.cache-hit }}' -ne 'true') {
            python bootstrap_compiler/scripts/release/prepare_windows_llvm.py --destination $llvm
            if ($LASTEXITCODE -ne 0) { throw 'LLVM preparation failed' }
          }
          "LLVM_ROOT=$llvm" >> $env:GITHUB_ENV
      - name: Save prepared Windows LLVM development files
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-22
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC build tools not found' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          & cmd /d /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and $value -ne [Environment]::GetEnvironmentVariable($name)) {
                "$name=$value" >> $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
      - name: Build compiler, tools and SDK archive
        timeout-minutes: 150
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python bootstrap_compiler/scripts/release/build_native.py --bootstrap-tag $env:BOOTSTRAP_TAG --llvm-root $env:LLVM_ROOT --work "$env:RUNNER_TEMP/vyx-build" --output "$env:GITHUB_WORKSPACE/release-assets" --jobs 4
          if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
      - name: Preserve failed compiler diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.name }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/vyx-build/source/bootstrap_compiler/.cache/*.log
            ${{ runner.temp }}/vyx-build/source/bootstrap_compiler/.cache/records_*.tmp
            ${{ runner.temp }}/vyx-build/source/bootstrap_compiler/out/*.compile.*.log
            ${{ runner.temp }}/vyx-build/self-source/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SDK-BUILD.*.json

  linux:
    if: inputs.build_scope != 'macos'
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check release scripts
        run: python -m unittest discover -s bootstrap_compiler/scripts/release -p "test_*.py"
      - name: Install Linux build dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 llvm-22-dev lld-22 libclang-cpp22-dev cmake ninja-build git patchelf zlib1g-dev libzstd-dev libxml2-dev
          echo 'LLVM_ROOT=/usr/lib/llvm-22' >> "$GITHUB_ENV"
      - name: Build compiler, tools and SDK archive
        timeout-minutes: 150
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python bootstrap_compiler/scripts/release/build_native.py --bootstrap-tag "$BOOTSTRAP_TAG" --llvm-root "$LLVM_ROOT" --work "$RUNNER_TEMP/vyx-build" --output "$GITHUB_WORKSPACE/release-assets" --jobs 4
      - name: Preserve failed compiler diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-linux-x86_64
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/vyx-build/source/bootstrap_compiler/.cache/*.log
            ${{ runner.temp }}/vyx-build/source/bootstrap_compiler/.cache/records_*.tmp
            ${{ runner.temp }}/vyx-build/source/bootstrap_compiler/out/*.compile.*.log
            ${{ runner.temp }}/vyx-build/self-source/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-linux-x86_64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SDK-BUILD.*.json

  termux:
    name: android-aarch64
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdk-linux-x86_64
          path: host-sdk
      - name: Prepare host SDK and Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git patchelf
          (cd host-sdk && sha256sum -c vyx-sdk-linux-x86_64-llvm22.tar.gz.sha256)
          tar -xf host-sdk/vyx-sdk-linux-x86_64-llvm22.tar.gz -C host-sdk
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Build and package Termux SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python bootstrap_compiler/scripts/release/build_termux.py \
            --bootstrap-tag "$BOOTSTRAP_TAG" \
            --host-sdk "$GITHUB_WORKSPACE/host-sdk/vyx-sdk-linux-x86_64-llvm22" \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --work "$RUNNER_TEMP/vyx-termux" --output "$GITHUB_WORKSPACE/release-assets" --jobs 4
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-android-aarch64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release-assets/*.deb
            release-assets/*.sha256
            release-assets/SDK-BUILD.*.json

  macos-cross:
    name: Export macOS ${{ matrix.arch }} objects
    if: inputs.macos_bootstrap == 'cross' && inputs.macos_stage != 'toolchain'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Export compiler and runtime Mach-O objects
        timeout-minutes: 130
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python bootstrap_compiler/scripts/release/build_macos.py export \
            --bootstrap-tag "$BOOTSTRAP_TAG" \
            --arch '${{ matrix.arch }}' --work "$RUNNER_TEMP/macos-export" \
            --output "$GITHUB_WORKSPACE/macos-bootstrap" --jobs 4
      - name: Preserve export diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-macos-export-${{ matrix.arch }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: ${{ runner.temp }}/macos-export/source/bootstrap_compiler/.cache-macos/*.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-bootstrap-${{ matrix.arch }}
          path: macos-bootstrap/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macos-${{ matrix.arch }} (${{ inputs.macos_bootstrap || 'native' }})
    needs: macos-cross
    if: ${{ !cancelled() && (needs.macos-cross.result == 'success' || needs.macos-cross.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check release scripts
        run: python -m unittest discover -s bootstrap_compiler/scripts/release -p 'test_*.py'
      - name: Install native build dependencies
        timeout-minutes: 15
        run: |
          brew install cmake ninja
          python -m pip install jsonschema
      - name: Restore macOS LLVM development cache
        id: macos-llvm
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-22
          key: llvm-dev-macos-${{ matrix.arch }}-22.1.8-c3a5b292-pinned-closure-v2
      - name: Prepare macOS LLVM development files
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ '${{ steps.macos-llvm.outputs.cache-hit }}' != true ]; then
            python bootstrap_compiler/scripts/release/prepare_macos_llvm.py --destination "$RUNNER_TEMP/llvm-22"
          else
            python -c 'import sys; from pathlib import Path; sys.path.insert(0, "bootstrap_compiler/scripts/release"); from prepare_macos_llvm import verify_toolchain; verify_toolchain(Path(sys.argv[1]))' "$RUNNER_TEMP/llvm-22"
          fi
          echo "LLVM_ROOT=$RUNNER_TEMP/llvm-22" >> "$GITHUB_ENV"
      - name: Save macOS LLVM development cache
        if: steps.macos-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-22
          key: ${{ steps.macos-llvm.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v8.0.2
        if: env.MACOS_BOOTSTRAP == 'cross' && inputs.macos_stage != 'toolchain'
        with:
          name: macos-bootstrap-${{ matrix.arch }}
          path: macos-bootstrap
      - name: Build and package macOS SDK
        if: inputs.macos_stage != 'toolchain'
        timeout-minutes: 200
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$MACOS_BOOTSTRAP" = cross ]; then
            input=(--cross-bundle "$GITHUB_WORKSPACE/macos-bootstrap")
          else
            input=(--bootstrap-tag "$BOOTSTRAP_TAG")
          fi
          if [ '${{ inputs.macos_fixpoint }}' = true ]; then
            input+=(--verify-fixpoint)
          fi
          python bootstrap_compiler/scripts/release/build_macos.py native "${input[@]}" \
            --arch '${{ matrix.arch }}' --llvm-root "$LLVM_ROOT" --work "$RUNNER_TEMP/vyx-macos" \
            --output "$GITHUB_WORKSPACE/release-assets" --jobs 4 2>&1 | tee "$RUNNER_TEMP/vyx-macos.log"
      - name: Preserve native macOS diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-macos-${{ matrix.arch }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/vyx-macos.log
            ${{ runner.temp }}/vyx-macos/source/bootstrap_compiler/.cache*/*.log
            ${{ runner.temp }}/vyx-macos/source/bootstrap_compiler/.cache*/tasks_*.tmp
            ${{ runner.temp }}/vyx-macos/source/bootstrap_compiler/out/*.compile.*.log
            ${{ runner.temp }}/vyx-macos/hello-gate/*
            ${{ runner.temp }}/vyx-macos/runtime-string-scan/*.json
            ${{ runner.temp }}/vyx-macos/packaged-sdk-smoke/*.json
            ${{ runner.temp }}/vyx-macos/self-source/
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.macos_stage != 'toolchain'
        with:
          name: sdk-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SDK-BUILD.*.json
      - name: Preserve toolchain input identity
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-toolchain-${{ matrix.arch }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/llvm-22/VYX-LLVM-INPUT.json

  publish:
    name: Publish complete SDK release
    needs: [native, linux, termux, macos]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.native.result == 'success' && needs.linux.result == 'success' && needs.termux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: sdk-*
          merge-multiple: true
          path: release-assets
      - name: Verify identities, allocate date tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bootstrap_compiler/scripts/release/publish.py --assets release-assets --commit "${{ github.sha }}"
