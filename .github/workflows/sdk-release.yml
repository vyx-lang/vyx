name: SDK release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: Compatible Stage 0 SDK release
        default: 1.0.0-alpha.1.fix
        type: string
        required: true

permissions:
  contents: read

env:
  BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag || '1.0.0-alpha.1.fix' }}
  PYTHONUNBUFFERED: '1'

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2022
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check release scripts
        run: python -m unittest discover -s bootstrap_compiler/scripts/release -p "test_*.py"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 llvm-22-dev lld-22 libclang-cpp22-dev cmake ninja-build git patchelf zlib1g-dev libzstd-dev libxml2-dev
          echo 'LLVM_ROOT=/usr/lib/llvm-22' >> "$GITHUB_ENV"
      - name: Install Windows LLVM development files and MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-22'
          python bootstrap_compiler/scripts/release/prepare_windows_llvm.py --destination $llvm
          if ($LASTEXITCODE -ne 0) { throw 'LLVM preparation failed' }
          "LLVM_ROOT=$llvm" >> $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC build tools not found' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          & cmd /d /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
      - name: Build compiler, tools and SDK archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python bootstrap_compiler/scripts/release/build_native.py --bootstrap-tag $env:BOOTSTRAP_TAG --llvm-root $env:LLVM_ROOT --work "$env:RUNNER_TEMP/vyx-build" --output "$env:GITHUB_WORKSPACE/release-assets" --jobs 4
          if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SDK-BUILD.*.json

  termux:
    name: android-aarch64
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdk-linux-x86_64
          path: host-sdk
      - name: Prepare host SDK and Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git patchelf
          (cd host-sdk && sha256sum -c vyx-sdk-linux-x86_64-llvm22.tar.gz.sha256)
          tar -xf host-sdk/vyx-sdk-linux-x86_64-llvm22.tar.gz -C host-sdk
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Build and package Termux SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python bootstrap_compiler/scripts/release/build_termux.py \
            --bootstrap-tag "$BOOTSTRAP_TAG" \
            --host-sdk "$GITHUB_WORKSPACE/host-sdk/vyx-sdk-linux-x86_64-llvm22" \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --work "$RUNNER_TEMP/vyx-termux" --output "$GITHUB_WORKSPACE/release-assets" --jobs 4
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-android-aarch64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release-assets/*.deb
            release-assets/*.sha256
            release-assets/SDK-BUILD.*.json

  publish:
    name: Publish complete SDK release
    needs: [native, termux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: sdk-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: sdk-*
          merge-multiple: true
          path: release-assets
      - name: Verify identities, allocate date tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bootstrap_compiler/scripts/release/publish.py --assets release-assets --commit "${{ github.sha }}"
